name: publish

# Builds a wheel + sdist on every tag push that looks like a version, and
# uploads it to PyPI using OIDC trusted-publisher (no API token in secrets).
#
# Before this works you have to do a one-time setup on PyPI:
#   https://pypi.org/manage/account/publishing/
# Configure a trusted publisher with:
#   PyPI Project Name: tokencounter
#   Owner:             victory-c
#   Repository:        token-counter
#   Workflow:          publish.yml
#   Environment:       pypi

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  smoke-test:
    # Confirms the published artifact actually installs and the CLI runs.
    # If PyPI accepted the upload but the wheel is somehow broken, the
    # first signal here is the workflow going red — not a user complaint.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for PyPI index to update
        # PyPI's index can lag the upload by ~30s. Without this, the install
        # below sometimes hits 404 on the just-published version.
        run: sleep 45
      - name: Install from PyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m pip install --upgrade pip
          pip install "tokencounter==$VERSION"
      - name: Smoke-test the CLI
        run: |
          tokencounter --version
          tokencounter --help
          tokenburn --version  # legacy alias
