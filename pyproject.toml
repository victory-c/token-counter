[project]
name = "tokencounter"
version = "0.2.0"
description = "Local-first CLI that audits monthly AI coding-agent token usage across Claude Code, Codex, Cursor, and Gemini."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Victor Chun" }]
license = { text = "MIT" }
keywords = [
    "llm",
    "tokens",
    "ai",
    "cli",
    "claude",
    "codex",
    "cursor",
    "gemini",
    "cost",
    "telemetry",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlite-utils>=3.36",
    "polars>=1.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/victory-c/token-counter"
Repository = "https://github.com/victory-c/token-counter"
Issues = "https://github.com/victory-c/token-counter/issues"

[project.scripts]
tokencounter = "tokenburn.cli:app"
# Legacy alias — keeps Twitter-thread / early-doc commands working.
tokenburn = "tokenburn.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenburn"]
artifacts = [
    "src/tokenburn/pricing.yaml",
    "src/tokenburn/classifier/model_classes.yaml",
    "src/tokenburn/classifier/task_fitness.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/tokenburn",
    "examples",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]
